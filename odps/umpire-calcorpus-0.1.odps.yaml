# ODPS 4.1 manifest — umpire Calibration Corpus v0.1
#
# Spec-first authoring 2026-10-23 per spec/odps-odcs-plan.md (T14: local-only now,
# zero provider spend). Structure and shapes mirror the ctxvm validated precedent
# (open-data-products SDK, ODPS 4.1 packaged); every empirically-derived gotcha is pre-applied:
#   quoted "4.1" · SLA unit enum has no `hours` · flat dataHolder/license ·
#   DQ descriptive.description as plain string · DQ executable as NAMED OBJECT with
#   object `spec` blocks · DQDefinition displayTitle as array of language maps ·
#   contractVersion = the ODCS standard's version · dataAccess.format enum excludes
#   JSONL (format: JSON + x-format note) · bundled core odps.json schema is the only truth.

schema: https://opendataproducts.org/v4.1/schema/odps.yaml
version: "4.1"
product:
  # ODCS linkage (audit requires a contract reference; $ref because the SDK does not
  # yet load remote contract documents).
  contract:
    id: dd6c0a8a-8376-594e-a772-d8ccba457c1e
    type: ODCS
    contractVersion: "3.0.2"
    $ref: ../contracts/umpire-calcorpus-0.1.odcs.yaml

  # sidecar (composition over extension, à la ctxvm's x-cabi): pin identity is echoed
  # verbatim from calibration/corpus-v3.capture.meta.json.
  x-umpire:
    format: xCABI
    traceFormatVersion: 0.1
    decisionProfile: xCABI-0.1-decision
    contentSchema: https://raw.githubusercontent.com/kapitaali/umpire/main/spec/decision-record-v0.schema.json
    conformanceVectors: https://raw.githubusercontent.com/kapitaali/umpire/main/calibration/corpus-v3.page-table.json
    calibrationSchema: https://raw.githubusercontent.com/kapitaali/umpire/main/calibration/corpus-v3.capture.meta.json
    calibrationStatVersion: cal-v1:057a5a35a9d4ec71
    calibrationMethod: isotonic/1
    firstDrop: calibration/v1
    latestDrop: calibration/v3
    modelPin:
      id: qwen3-1.7b
      model: qwen3-1.7b
      weights_sha256: sha256:66a17017845b71fcd2ddbcc6ed4e556c194e5bbb31b27c46a82bf25f3e055a7f
      decoding: json-label-enum-v0@llama.cpp-v0.7.0/sha256:0f60e0483
      prompt_template_sha256: sha256:548522885e4736c1e9563ce6990a7675ff4ec416dd4cbd2eda0ad16ab8fd1875
      runner_binary_sha256: sha256:0f60e0483ee8aa394f2fadf487dcdcc7799abdd5941127952f17277ebe4ec61c
      server_invocation: "./runners/src/build/bin/llama-server -m models/Qwen3-1.7B-Q8_0.gguf -c 2048 --host 127.0.0.1 --port 8081 --threads 4"
    seed: 7
    server: http://127.0.0.1:8081
    captureWindow:
      started_at: "2026-10-24T06:02:52.557485+00:00"
      finished_at: "2026-10-24T07:43:53.084391+00:00"
    host_sha256: sha256:1e769fcd99223f5a
    platform: Linux-6.12.113+deb13-amd64-x86_64-with-glibc2.41
    page_table_stats:
      decisions: 480
      declared_slots: 480
      re_decides: 0
    checksums:                # from calibration/checksums-v3.sha256 (9/9 gate)
      corpus: sha256:54e397333ab750ff7fff6a54272b7d4ec4a7163aac16bb2778401895410a66a3
      corpus_meta: sha256:270cfa2b00fc5f5ee84f1d0c1ea621c659312addc41c26f9e0b27f4a2120df10
      raw: sha256:8ecbd6eea4cc4561534a3495a16fad87f17d2713b1aec0f3cc460bd2616db6be
      ledger: sha256:58b5ed2e7869352bb450d2bb7fdaf6ac1c52486eca233de6d1b1858a9627f7a7
      records: sha256:d8b36b62c9e712ecf53e3d0e7ca74773106950ade54dea298e5602ac32d19fe8
      page_table: sha256:25b073cbc59a5e2c6bf03a686908b4cd3ae7848944d75262e3d73013e6dfacd2
      calibrated_records: sha256:8abeaddc82a22e663d44b0d243c716153e229418a2eff8cfa0af1a642c2cb153
      artifact: sha256:b94ce06f349b7afae4566555abf9b976de225d61cb6eebd6e6a9e4499cd56c6d
      capture_meta: sha256:53825b56525402f1f6139768f1ce945a9abe5f1f2506db95c55cf989eac7546f
    replayAudit:
      full_corpus: >-
        2026-10-23 full 480-row model audit (harness/replay_audit.py, all rows):
        470/480 strict; 10/480 distribution-only (contentHash+probabilities; max Δp
        0.1206 with argmax unchanged, 9/10 ≤ 6.1e-3); identity ref/key/model_pin 480/480;
        0 errors. See RR-M3FULL-20261024.
      reproducibility: >-
        2026-10-24 quiescent rerun of the same 10 rows on a freshly restarted pinned
        server: distributions bit-identical to the 2026-10-23 actuals 10/10 (plus 3/3
        rows in an interrupted partial sample), identity 10/10; divergence is between
        the capture baseline and the replay path, not between audit runs.
      attribution: >-
        CONFIRMED by the 2026-10-24 quiescent v3 recapture (480/480; the shared MCP
        decide ledger shows no writes inside the 06:02:52Z–07:43:53Z window):
        470/480 rows contentHash-identical to the v2 capture, and the 10 suspect rows
        relaxed to exactly the replay-path distribution values (split 5 train /
        4 validation / 1 test; max Δp 0.1206 with argmax unchanged everywhere).
        Capture-time concurrency of the v2 capture is the attribution — the second
        decide client (ledger alive to 14:50:20Z) overlapped that capture window.
      structural: >-
        Full-run replay corpus committed at tests/m3-replay-full; validator PASS
        2488 checks + negatives 12/12; page-table roundtrip BYTE-IDENTICAL
        (sha256:25b073cbc59a5e2c, 2402 checks); page_table_stats re-decides 0; the
        v3 capture's own page-table hashes to the same sha256:25b073cbc… as the
        committed replay baseline (capture-time = replay-time, byte-for-byte).
      quiescent_smoke: 8/8 strict match (harness/replay_audit.py, 2 test rows per label)
      note: >-
        Raw probability distributions remain load-sensitive to concurrent capture:
        rows captured while another decide client shares the pinned server carry
        small distribution offsets, so raw-probability bit-identity is claimed for
        quiescent same-build same-machine capture and replay only; identity
        (ref/key/model_pin) held 480/480 under all observed conditions. The v3
        quiescent recapture landed 2026-10-24 (cal-v1:057a5a35a9d4ec71) and is the
        calibration of record; v2 is retained unchanged as the annotated
        concurrency-affected revision (10 rows) for provenance and comparability.

  details:
    en:
      name: umpire Calibration Corpus
      productID: umpire-calcorpus-0.1
      valueProposition: >-
        Calibrated typing for local decision primitives, audited the xCABI way:
        a checksummed, replay-deterministic decision corpus with honest calibration
        metrics anyone can recompute from checksums alone.
      description: >-
        The umpire M2 calibration corpus v3 drop (quiescent recapture of the same
        v2 corpus): 480 project-authored support-intent examples (4 labels, 120/label,
        split 240/120/120; corpus file unchanged across v2 → v3), the caller-owned
        routing guide inside every state, 480 live decisions captured from a pinned,
        hash-stamped Qwen3-1.7B local GGUF (seed 7) under a JSON-schema constrained
        grammar with ZERO concurrent decide traffic, a 481-event xCABI-0.1 decision
        ledger, 480 payload records, an isotonic calibration artifact
        (cal-v1:057a5a35a9d4ec71), a calibrated sidecar on the 120 untouched test rows,
        and the deterministic page-table replay baseline (byte-identical to the
        committed Oct-23 roundtrip, sha256:25b073cbc…). On the test split, isotonic
        calibration reduces ECE 0.2473 (raw top) → 0.0302 and Brier 0.2388 → 0.1726
        with accuracy unchanged (0.7083); paired-bootstrap 95% CIs exclude zero.
        Honest limits: single project-authored corpus, one pin/seed/machine/runner
        build, n=120 directional vs the retained v1 n=40 caveat; raw probabilities,
        ref and contentHash are unchanged by calibration; accuracy is not comparable
        across corpus revisions (v2 rows are deliberately harder); the artifact
        estimates P(key correct) — it is not a correctness guarantee.
      productVersion: 0.1.0
      productSeries: umpire open corpus
      visibility: public
      status: draft
      type: dataset
      portfolioPriority: high
      governanceProfile: automated
      standards:
        - xCABI 0.1
        - ODPS 4.1
        - ODCS 3.0.2
        - umpire-calibration 0.1
      outputFileFormats:
        - JSONL
        - JSON
      categories:
        - decision-classification
        - llm-calibration
        - benchmarks
      tags:
        - open-data
        - replay-determinism
        - calibration
        - zero-provider
        - local-ai

  productStrategy:
    status: Active
    startDate: 2026-10-23
    objectives:
      - en: >-
          Make claim-quality auditing of local decision primitives reproducible:
          anyone can re-decide the corpus, verify the ledger, and recompute the
          calibration metrics from checksums alone.
    contributesToKPI:
      id: kpi-calibrated-ece
      name: Calibrated ECE on test split
      unit: percentage
      target: 5
      direction: at_most
      calculation: expected_calibration_error(calibrated_confidence, gold, test_split n=120)
    productKPIs:
      - id: kpi-replay-determinism
        name: Replay determinism
        unit: percentage
        target: 100
        direction: at_least
        calculation: byte_identical_roundtrips / declared_slots (page-table replay)
      - id: kpi-negative-conformance
        name: Negative conformance pass rate
        unit: percentage
        target: 100
        direction: at_least
        calculation: validator_negative_cases_passed / validator_negative_cases (raw + calibrated)
      - id: kpi-calibrated-brier
        name: Calibrated Brier (test split)
        unit: percentage
        target: 20
        direction: at_most
        calculation: 100 * brier_score(calibrated_confidence, gold, test_split n=120)
      - id: kpi-decision-accuracy
        name: Decision accuracy on test split
        unit: percentage
        target: 68
        direction: at_least
        calculation: 100 * correct / n (test_split n=120, constrained one-token-class decode)

  SLA:
    declarative:
      default:
        name:
          en: Calibration corpus release SLA
        description:
          en: Promises on drop integrity operations, not model-accuracy claims.
        dimensions:
          - dimension: updateFrequency
            objective: 26
            unit: weeks
            weight: 40
            description: Maximum declared gap between calibration drops; revisions are authored, not scheduled.
          - dimension: timeToDetect
            objective: 1
            unit: days
            weight: 35
            description: Checksum, replay and validator gates run locally on every change before release.
          - dimension: errorRate
            objective: 0
            unit: percent
            weight: 25
            description: Zero-tolerance release gates — checksum/replay/validator failures never ship in a drop.
    support:
      email: kapitaali@users.noreply.github.com
      documentationURL: https://github.com/kapitaali/umpire#readme

  dataQuality:
    declarative:
      default:
        displayTitle:
          - en: Determinism-grade calibration quality
        description: Pinned page-table replay is byte-identical; validator gates pass incl. negatives; every drop checksums.
        dimensions:
          - dimension: validity        # = replay determinism (proxy; x-umpire scopes the claim)
            objective: 100
            unit: percentage
            weight: 60
          - dimension: completeness    # = calibrated sidecar covers every test row; no dangling pin refs
            objective: 100
            unit: percentage
            weight: 25
          - dimension: uniqueness      # = corpus dedup + secret/PII scan clean
            objective: 100
            unit: percentage
            weight: 15
    # executable is a NAMED OBJECT (schema truth); each value is a DQDefinition;
    # spec MUST be an object even for type: Custom.
    executable:
      replayDeterminism:
        type: Custom
        version: 0.1.0
        reference: https://raw.githubusercontent.com/kapitaali/umpire/main/00-SPEC.md
        spec:
          tool: umpire
          command: "python3 spec/validate_ledger.py --replay calibration/corpus-v3.ledger.jsonl calibration/corpus-v3.records.jsonl calibration/corpus-v3.page-table.json"
          passCriterion: >-
            roundtrip BYTE-IDENTICAL; page-table sha256 unchanged (sha256:25b073cbc…);
            quiescent model-level replay audit per RR-M3FULL documented separately
            and CONFIRMED by the v3 recapture (470/480 content-identical, 10/10 exactly
            the replay-path values).
        dimensions:
          - dimension: validity
            objective: 100
            unit: percentage
            weight: 60
      calibrationParity:
        type: Custom
        spec:
          tool: umpire
          command: "python3 spec/validate_ledger.py calibration/corpus-v3.ledger.jsonl calibration/corpus-v3.calibrated.records.jsonl"
          passCriterion: PASS (2608 checks); negative corpus 12/12
        dimensions:
          - dimension: completeness
            objective: 100
            unit: percentage
            weight: 25
      redactionScan:
        type: Custom
        spec:
          tool: umpire
          command: full-corpus token/PII scan over the calibration drop (project pattern set)
          passCriterion: zero secret / PAT / PII matches
        dimensions:
          - dimension: uniqueness
            objective: 100
            unit: percentage
            weight: 15

  dataAccess:
    default:
      name:
        en: Calibration corpus drop
      description:
        en: >-
          Checksummed JSONL drop (corpus, raw, ledger, records, calibrated records)
          plus fitted calibration artifact and replay baseline, tagged calcorpus-0.1.0.
      outputPortType: file
      format: JSON           # 'JSONL' is not in the format enum — see x-format note
      # x-format: jsonl
      accessURL: https://github.com/kapitaali/umpire/releases/tag/calcorpus-0.1.0
      hashType: SHA-256
      checksum: TBD-at-release
      documentationURL: https://github.com/kapitaali/umpire#readme
      # x-umpire repo paths (local resolution while status: draft):
      # calibration/corpus-v2.jsonl (+ .meta.json — corpus file unchanged since v2),
      # calibration/{raw-v3.jsonl, corpus-v3.ledger.jsonl, corpus-v3.records.jsonl,
      # corpus-v3.calibrated.records.jsonl, corpus-v3.page-table.json,
      # corpus-v3.capture.meta.json}, calibration/umpire-cal-v3.json,
      # calibration/checksums-v3.sha256

  # schema: license is FLAT (no language-binding wrapper)
  license:
    scope:
      definition: >-
        Open-data (Apache-2.0/CC-BY-4.0 family) access with attribution; redaction scan
        required before content is accepted or redistributed.
      restrictions: >-
        No redistribution of content failing the redaction scan; downstream users must
        preserve checksum lineage of derived corpora; calibration artifacts are per
        pin/label-set/seed/machine and must not be presented as transferable.
      permanent: true
      exclusive: false
      rights:
        - Reproduction
        - Display
        - Distribution
        - Adaptation
    governance:
      ownership: umpire Project
      applicableLaws: >-
        Apache-2.0 for code and calibration artifacts (umpire-calibration/0.1 pin-identity
        data); CC-BY-4.0 for corpus content
      audit: Acceptance contributions are public (PR-based)

  # schema: dataHolder is FLAT (doc shows dataHolder.en wrapper — wrong)
  dataHolder:
    legalName: umpire Project
    businessDomain: decision-infra
    email: kapitaali@users.noreply.github.com
    URL: https://github.com/kapitaali/umpire
